version: '3.8'

# ==============================================================================
# AutoReiv Control Plane - Docker Compose Manifest [REQ-DEPLOY-005]
# Persistent volume mounts for database & PARA-Wiki storage
# ==============================================================================

services:
  autoreiv:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoreiv-control-plane
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - AUTOREIV_DATA_DIR=/data
      - PORT=8000
      - HOST=0.0.0.0
      # Local & Self-Hosted Providers
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - LMSTUDIO_HOST=${LMSTUDIO_HOST:-}
      - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-}
      - VLLM_HOST=${VLLM_HOST:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      # Cloud Providers
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - TOGETHER_BASE_URL=${TOGETHER_BASE_URL:-https://api.together.xyz/v1}
      # Gateway & Reliability Timeouts
      - GATEWAY_DEFAULT_TIMEOUT_SECONDS=${GATEWAY_DEFAULT_TIMEOUT_SECONDS:-180.0}
    volumes:
      - autoreiv-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/agents')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  autoreiv-data:
