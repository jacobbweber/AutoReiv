[project]
name = "autoreiv"
version = "0.46.0"
description = "Autonomous AI Agent Control Plane & Hybrid Execution Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "cryptography>=42.0.0",
    "paramiko>=3.4.0",
]


[project.scripts]
autoreiv = "src.cli.main:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-xdist>=3.5",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "guard: architecture/boundary guard tests; run on every preflight --fast",
    "slow: files over ~3 s wall time; skipped by preflight --fast (changed and mapped tests)",
    "serial: cannot run under pytest-xdist; preflight runs these in a separate serial pass",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
