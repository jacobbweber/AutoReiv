[project]
name = "autoreiv"
version = "0.17.0"
description = "Autonomous AI Agent Control Plane & Hybrid Execution Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
]


[project.scripts]
autoreiv = "src.cli.main:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
