<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>AutoReiv Control Plane</title>
  <!-- ES Module Preloads for First-Paint Optimization [REQ-PERF-003] -->
  <link rel="modulepreload" href="/static/app.js">
  <link rel="modulepreload" href="/static/modules/dom.js">
  <link rel="modulepreload" href="/static/modules/state/store.js">
  <link rel="modulepreload" href="/static/modules/utils/physics.js">
  <link rel="modulepreload" href="/static/modules/utils/accessibility.js">
  <link rel="modulepreload" href="/static/modules/ui/toast.js">
  <!-- Tailwind CSS CDN -->

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons CDN (Pinned reliable jsDelivr build) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <!-- Marked.js CDN for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <!-- Mermaid.js CDN for Diagram rendering -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'dark',
        securityLevel: 'loose',
        darkMode: true,
        themeVariables: {
          darkMode: true,
          background: '#0f172a',
          primaryColor: '#4f46e5',
          primaryTextColor: '#f8fafc',
          primaryBorderColor: '#6366f1',
          lineColor: '#94a3b8',
          secondaryColor: '#1e293b',
          tertiaryColor: '#0f172a'
        }
      });
    }
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#1e1b4b',
              950: '#0f0e26',
            }
          },
          borderRadius: {
            'tag': '4px',
            'btn': '8px',
            'card': '12px',
            'panel': '16px',
          }
        }
      }
    }
  </script>
  <!-- AutoReiv Modular Stylesheets [CARD-396] -->
  <link rel="stylesheet" href="/static/css/base.css?v=2.0.82">
  <link rel="stylesheet" href="/static/css/components.css?v=2.0.120">
  <link rel="stylesheet" href="/static/css/desktop.css?v=2.0.83">
  <link rel="stylesheet" href="/static/css/studios.css?v=2.0.83">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white">
  <div id="appRoot">

    <!-- Offline & Degraded Backend Connectivity Banner [REQ-TOAST-003] -->
    <div id="offlineBanner" role="alert" aria-live="assertive" class="hidden bg-amber-500/10 border-b border-amber-500/30 px-4 py-2 text-amber-200 text-xs flex items-center justify-between z-40 backdrop-blur">
      <div class="flex items-center space-x-2">
        <i data-lucide="wifi-off" class="w-4 h-4 text-amber-400"></i>
        <span><strong>Connection Degraded:</strong> Unable to reach AutoReiv Gateway. Attempting to reconnect...</span>
      </div>
      <button id="offlineBannerRetryBtn" class="px-2.5 py-1 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 rounded text-[11px] font-semibold text-amber-100 transition">
        Retry Now
      </button>
    </div>

    <!-- Mobile Header with 3-Surface Navigation [CARD-139] -->
    <header class="md:hidden flex items-center justify-between px-3 py-2 bg-slate-900 border-b border-slate-800 flex-shrink-0 z-30">
      <div class="flex items-center space-x-2">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brand-600 via-indigo-500 to-cyan-400 flex items-center justify-center font-bold text-white shadow-lg shadow-brand-500/20 text-xs">
          A
        </div>
        <span class="font-bold tracking-tight text-sm text-white hidden xs:inline">AutoReiv</span>
      </div>

      <!-- 3-Surface Switcher Pill (Cockpit, Vault, Fleet) [CARD-139] -->
      <div id="mobileSurfaceSwitcher" class="flex items-center bg-slate-800/90 p-0.5 rounded-xl border border-slate-700/60 text-xs font-semibold">
        <button type="button" id="surfaceBtnCockpit" data-surface="cockpit" class="surface-btn active px-2.5 py-1 rounded-lg bg-brand-600 text-white transition flex items-center space-x-1" title="Cockpit Studio">
          <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
          <span>Chat</span>
        </button>
        <button type="button" id="surfaceBtnVault" data-surface="vault" class="surface-btn px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition flex items-center space-x-1" title="Vault (Wiki & Projects)">
          <i data-lucide="book-marked" class="w-3.5 h-3.5"></i>
          <span>Vault</span>
        </button>
        <button type="button" id="surfaceBtnFleet" data-surface="fleet" class="surface-btn px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition flex items-center space-x-1" title="Fleet (Agents & Ops)">
          <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
          <span>Fleet</span>
        </button>
      </div>

      <button id="mobileMenuBtn" class="p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white focus:outline-none" title="Conversations & History">
        <i data-lucide="panel-left" class="w-5 h-5"></i>
      </button>
    </header>

    <div class="flex-1 flex overflow-hidden relative min-h-0">

      <!-- Sidebar Navigation Drawer (Streamlined for Conversations, Collapsed by Default on Desktop) [CARD-139] -->
      <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-slate-900/95 backdrop-blur border-r border-slate-800 flex flex-col transition-transform transform -translate-x-full md:relative md:translate-x-0 md:hidden flex-shrink-0 shadow-2xl">
      
      <!-- Brand & Header -->
      <div id="sidebarDrawerHeader" class="p-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-950/40">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-cyan-400 flex items-center justify-center font-black text-white shadow-md shadow-brand-500/30 text-xs">
            A
          </div>
          <div>
            <h1 class="font-bold text-sm tracking-tight text-white">Conversations</h1>
            <p class="text-[10px] text-slate-400 font-mono">Chat History & Sessions</p>
          </div>
        </div>
        <button id="closeSidebarBtn" class="p-1.5 rounded-lg text-slate-400 hover:text-white" title="Close Drawer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- CARD-296: sessions live in Chat in-studio drawer; sidebar keeps studio nav only -->
      <div id="sidebarChatSection" class="flex-1 flex flex-col overflow-hidden p-3 space-y-2.5 min-h-0">
        <p class="text-[11px] text-slate-500 leading-relaxed">Open Chat → + Options for New chat; Sessions (panel) for recent chats. Agent picker lives in Chat.</p>
      </div>

      <!-- Studio Tabs (Pinned at the bottom with consistent sizes) [REQ-SURFACE-005] -->
      <div id="sidebarNav" role="tablist" aria-orientation="vertical" aria-label="Studio Navigation" class="p-2.5 border-t border-slate-800 bg-slate-950/70 space-y-1 flex-shrink-0">
        <div class="text-[10px] font-mono uppercase tracking-wider text-slate-500 px-1">All Studios</div>
        <div class="grid grid-cols-2 gap-1 text-xs">
          <button id="tab-chat" data-tab="chat" role="tab" aria-selected="true" aria-controls="view-chat" class="tab-btn active col-span-2 flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-xs font-medium transition bg-brand-600 text-white">
            <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
            <span>Chat Studio</span>
          </button>
          <button id="tab-wiki" data-tab="wiki" role="tab" aria-selected="false" aria-controls="view-wiki" class="tab-btn flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
            <i data-lucide="book-marked" class="w-3.5 h-3.5"></i>
            <span>Wiki</span>
          </button>
          <button id="tab-projects" data-tab="projects" role="tab" aria-selected="false" aria-controls="view-projects" class="tab-btn flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
            <i data-lucide="folders" class="w-3.5 h-3.5"></i>
            <span>Projects</span>
          </button>
          <button id="tab-agents" data-tab="agents" role="tab" aria-selected="false" aria-controls="view-agents" class="tab-btn flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
            <i data-lucide="users" class="w-3.5 h-3.5"></i>
            <span>Agents</span>
          </button>
          <button id="tab-capabilities" data-tab="capabilities" data-studio="capabilities" role="tab" aria-selected="false" aria-controls="view-capabilities" class="tab-btn flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
            <i data-lucide="folder-tree" class="w-3.5 h-3.5 text-emerald-400"></i>
            <span>Capabilities</span>
          </button>
          <button id="tab-routines" data-tab="routines" role="tab" aria-selected="false" aria-controls="view-routines" class="tab-btn flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
            <span>Routines</span>
          </button>
          <button id="tab-observability" data-tab="observability" role="tab" aria-selected="false" aria-controls="view-observability" class="tab-btn flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
            <i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i>
            <span>Metrics</span>
          </button>
          <button id="tab-settings" data-tab="settings" role="tab" aria-selected="false" aria-controls="view-settings" class="tab-btn flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
            <i data-lucide="settings" class="w-3.5 h-3.5"></i>
            <span>Settings</span>
          </button>
          <button id="navPrompts" data-tab="prompts" data-studio="prompts" role="tab" aria-selected="false" aria-controls="view-prompts" class="tab-btn flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i>
            <span>Prompts</span>
          </button>
          <button id="btn-study-entry" type="button" data-card="437" class="flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white hover:bg-slate-800 border border-sky-800/40 bg-sky-950/30" title="Study: open Tutor in education mode with course context (Education Studio stays)" aria-label="Study entry - Tutor education mode">
            <i data-lucide="book-open-check" class="w-3.5 h-3.5 text-emerald-400"></i>
            <span>Study</span>
          </button>
          <button id="tab-education" data-tab="education" data-studio="education" role="tab" aria-selected="false" aria-controls="view-education" class="tab-btn flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
            <i data-lucide="graduation-cap" class="w-3.5 h-3.5 text-sky-400"></i>
            <span>Education</span>
          </button>
        </div>
      </div>

      <!-- Footer / Host Badge -->
      <div class="p-2.5 border-t border-slate-800 bg-slate-900/50 flex items-center justify-between text-xs text-slate-400 flex-shrink-0">
        <div class="flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="hostSpecLabel">Local Ready</span>
        </div>
        <span class="text-slate-400 font-mono text-[10px]">WAL Active</span>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-h-0 overflow-hidden bg-slate-950 min-w-0">
      
      <!-- @include partials/chat.html -->
      <!-- @include partials/routines_observability.html -->
      <!-- @include partials/agents.html -->
      <!-- @include partials/settings_core.html -->
      <!-- @include partials/settings_preferences.html -->
      <!-- @include partials/wiki_projects.html -->
      <!-- @include partials/prompts_education_skill_studio.html -->
      <!-- @include partials/tools_capabilities.html -->
    </main>
  <!-- @include partials/modals.html -->
  <!-- Fixed Toast Container [REQ-TOAST-001] -->
  <div id="toastContainer" role="region" aria-label="Notifications" aria-live="polite" aria-atomic="true" class="fixed right-4 z-[11000] bottom-[calc(6rem+env(safe-area-inset-bottom,0px))] flex flex-col space-y-2 pointer-events-none max-w-sm w-full px-4 sm:px-0" data-card-624="above-dock"></div>

  <script type="module" src="/static/app.js?v=2.0.122"></script>
</body>
</html>
