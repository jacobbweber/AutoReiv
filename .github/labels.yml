# Label manifest — declarative source of truth for repository labels.
# Apply with a label-sync action or `gh label create`. Namespaced for grouping/scripting.

# --- Type (what kind of work) ---
- name: "type:epic"
  color: "5319e7"
  description: "Large body of work spanning multiple stories"
- name: "type:feature"
  color: "0e8a16"
  description: "New capability / user story"
- name: "type:bug"
  color: "d73a4a"
  description: "Behavior contrary to spec"
- name: "type:chore"
  color: "fef2c0"
  description: "Maintenance, tooling, housekeeping"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation or spec-only change"
- name: "type:refactor"
  color: "c5def5"
  description: "Internal change, no behavior change"
- name: "type:test"
  color: "bfd4f2"
  description: "Tests only"
- name: "type:spike"
  color: "d4c5f9"
  description: "Time-boxed research / investigation"

# --- Priority ---
- name: "P0-critical"
  color: "b60205"
  description: "Drop everything"
- name: "P1-high"
  color: "d93f0b"
  description: "Next up"
- name: "P2-medium"
  color: "fbca04"
  description: "Normal"
- name: "P3-low"
  color: "0e8a16"
  description: "Nice to have"

# --- Area (maps to DDD concerns; adjust per project) ---
- name: "area:architecture"
  color: "1d76db"
  description: "Architecture / vision"
- name: "area:backend"
  color: "1d76db"
  description: "Backend / internal logic"
- name: "area:frontend"
  color: "1d76db"
  description: "UI / UX / frontend"
- name: "area:testing"
  color: "1d76db"
  description: "Testing / optimization"
- name: "area:lifecycle"
  color: "1d76db"
  description: "Lifecycle / backlog / external"
- name: "area:ci-cd"
  color: "1d76db"
  description: "CI/CD / automation"

# --- Workflow signals ---
- name: "blocked"
  color: "000000"
  description: "Cannot proceed; dependency unmet"
- name: "needs-triage"
  color: "ededed"
  description: "Awaiting grooming"
- name: "needs-spec"
  color: "e99695"
  description: "Spec missing or contradictory"
- name: "tech-debt"
  color: "fbca04"
  description: "Known shortcut to repay"
- name: "security"
  color: "b60205"
  description: "Security-sensitive"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates"
- name: "good-first-issue"
  color: "7057ff"
  description: "Good entry point"
