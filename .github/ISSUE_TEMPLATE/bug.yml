name: Bug
description: Something behaves contrary to expected behavior or card contract.
title: "bug: <what is wrong>"
labels: ["type:bug", "needs-triage"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What should happen vs what actually happens.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce.
    validations:
      required: true
  - type: input
    id: card_or_adr
    attributes:
      label: Card / ADR reference
      description: Which card or ADR defines the expected behavior?
    validations:
      required: false
