name: Bug
description: Something behaves contrary to spec.
title: "bug: <what is wrong>"
labels: ["type:bug", "needs-triage"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What should happen (per which spec) vs what happens.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce.
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec reference
      description: Which spec defines the correct behavior?
    validations:
      required: false
